<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fixture</title>
<!--
  The privacy fixture for app shots (docs/keyframes-and-text.md, "What app state never keeps").

  Open it with a marker in the URL:
    appshot-secret.html?token=SECRET-MARKER-URL#SECRET-MARKER-FRAGMENT
  Type SECRET-MARKER-INPUT into Name and SECRET-MARKER-PASSWORD into Password, click Save,
  record it with Annotator, then:
    grep -r SECRET-MARKER <the capture's .scrawl folder>
  must find nothing.

  The window title carries the page's whole URL, marker included, so the title goes through the
  same rule as every other string. The text of the paragraphs and the button is static text:
  it is kept, as it is on the keyframe image too.
-->
<style>
  body { font: 16px/1.5 -apple-system, sans-serif; max-width: 34rem; margin: 3rem auto; }
  label { display: block; margin: 1rem 0 0.25rem; }
  input { font: inherit; padding: 0.4rem 0.6rem; width: 100%; box-sizing: border-box; }
  button { font: inherit; margin-top: 1.25rem; padding: 0.5rem 1.25rem; }
  #saved { margin-top: 1rem; color: #0a7a35; }
</style>
</head>
<body>
<h1>Settings</h1>
<p>Open the settings to change your keys.</p>
<p>A link with a query: <a id="reset" href="https://example.com/reset?token=SECRET-MARKER-URL">Reset your keys</a></p>

<label for="name">Name</label>
<input id="name" type="text" placeholder="Your name">

<label for="password">Password</label>
<input id="password" type="password">

<label for="notes">Notes</label>
<textarea id="notes" rows="2" style="font: inherit; width: 100%; box-sizing: border-box;"></textarea>

<button id="save" type="button">Save</button>
<p id="saved" hidden>Saved.</p>

<script>
  // The title holds the whole URL, query and fragment included.
  document.title = "Fixture " + location.href;
  document.getElementById("save").addEventListener("click", () => {
    document.getElementById("saved").hidden = false;
  });
</script>
</body>
</html>
